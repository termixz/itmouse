<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>
    <div>
        <button onclick="drinkStorage.addValue(prompt('Введите название напитка:'), prompt('Введите рецепт напитка, алкогольный он или нет:'))" >Ввод информации о напитке</button>

        <button onclick="let drink = prompt('Введите название напитка:'); alert(drinkStorage.getValue(drink) == undefined ? 'Нету такого напитка' : drinkStorage.getValue(drink))" >Получение информации о напитке</button>

        <button onclick="alert(drinkStorage.getKeys())" >Перечень всех напитков</button>

        <button onclick="drinkStorage.deleteValue(prompt('Введите название напитка:'))" >Удаление информации о напитке</button>
    </div>
	<script type="text/javascript" src="scripts.js"></script>
</body>
</html>
