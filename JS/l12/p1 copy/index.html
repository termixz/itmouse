<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
	<title>Мой список задач</title>
</head>
<body>
    <div class="container">
        <div class="first">
            <h2>Список дел</h2>
            <div class="actions">
                <input type="text" class="addTask"></input>
                <button class="switcher" onclick="switcher()">🌚</button>
            </div>
        </div>
        
        <ul id="list"></ul>
        
        <div class="footer-btns">
            <button onclick="showAll()" class="showAll">Показать всё</button> 
            <button onclick="showCompleted()" class="showCompleted">Показать выполненые</button> 
        </div>
    </div>
	<script type="text/javascript" src="scripts.js"></script>
</body>
</html>
