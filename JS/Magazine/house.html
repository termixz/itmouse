<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="icon" href="./IMG/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <title>Детали дома</title>
</head>
<body>
    <header> 
        <h2>ДОМА НЕДОРОГО.by</h2>
        <button id="back" style="margin-right: 20px; padding: 5px 15px;">Назад</button>
    </header>
    
    <main class="content-wrapper" style="display: flex; padding: 40px; gap: 20px; flex-wrap: wrap;">
        <div id="view" class="houses" style="flex: 1; display: flex; flex-direction: column; padding: 0;">
            </div>
        
        <div style="flex: 1; min-width: 300px;">
            <div id="map" style="height: 400px; border-radius: 12px; margin-bottom: 20px;"></div>
            <div id="weather" style="background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                <h3>Средние температуры по сезонам</h3>
                <div id="season-temps">Загрузка...</div>
            </div>
        </div>
    </main>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="house.js"></script>
</body>
</html>
