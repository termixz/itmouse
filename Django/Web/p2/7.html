<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <style>
        .form-container {
            width: fit-content;
            margin: 50px auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .field {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-family: serif;
            font-size: 16px;
        }

        input[type="text"], 
        input[type="password"] {
            padding: 2px 5px;
            border: 1px solid gray;
            border-radius: 2px;
        }

        input[type="submit"] {
            cursor: pointer;
            padding: 2px 8px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="field">
            <label for="login">Логин</label>
            <input type="text" id="login">
        </div>
        <div class="field">
            <label for="password">Пароль</label>
            <input type="password" id="password">
        </div>
        <input type="submit" value="Отправить">
    </div>

</body>
</html>
