<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>О Сайте</title>
    <link rel="stylesheet" href="{% static 'css/styles5.css' %}">
</head>
<body>
    <div class="overlay">
    <!-- LOGN IN FORM by Omar Dsoky -->
    <form method="POST">
    {% csrf_token %}
       <!--   con = Container  for items in the form-->
       <div class="con">
       <!--     Start  header Content  -->
       <header class="head-form">
          <h2>Log In</h2>
          <!--     A welcome message or an explanation of the login form -->
          <p>login here using your username and password</p>
       </header>
       <!--     End  header Content  -->
       <br>
       <div class="field-set">

          <!--   user name -->
             <span class="input-item">
               <i class="fa "></i>
             </span>
            <!--   user name Input (добавлен name="name") -->
             <input class="form-input" id="txt-input" type="text" name="name" placeholder="@UserName" required>

          <br>

               <!--   Password -->

          <span class="input-item">
            <i class="fa "></i>
           </span>
          <!--   Password Input-->
          <input class="form-input" type="password" placeholder="Password" id="pwd" name="password" required>

          <br>
    <!--        buttons -->
    <!--      button LogIn -->
          <button type="submit" class="log-in"> Log In </button>
       </div>

    <!--   other buttons -->
       <div class="other">
    <!--      Forgot Password button-->
          <button type="button" class="btn submits frgt-pass">Forgot Password</button>
    <!--     Sign Up button -->
          <button type="button" class="btn submits sign-up">Sign Up
    <!--         Sign Up font icon -->
          <i class="fa" aria-hidden="true"></i>
          </button>
    <!--      End Other the Division -->
       </div>

    <!--   End Conrainer  -->
      </div>

      <!-- End Form -->
    </form>
    </div>
</body>
</html>
